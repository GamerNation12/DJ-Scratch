[package]
name = "dj-scratch-desktop"
version = "2.2.10"
edition = "2021"
description = "DJ Scratch Desktop — Discord music stats dashboard"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[profile.release]
opt-level = 3
