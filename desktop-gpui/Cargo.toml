[package]
name = "dj-scratch-desktop"
version = "2.2.10"
edition = "2021"
description = "DJ Scratch Desktop — Discord music stats dashboard (GPUI)"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", branch = "master" }
gpui_kit = { git = "https://github.com/zed-industries/zed", package = "gpui_kit", branch = "master" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]

[profile.release]
opt-level = 3
