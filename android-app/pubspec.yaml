name: dj_scratch
description: "DJ Scratch — music stats dashboard (v1 rebuild)."
publish_to: 'none'

version: 2.2.9+37

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_web_auth_2: ^3.1.1
  flutter_secure_storage: ^9.2.2
  # Era-pinned: CI Flutter 3.24 (Dart 3.5) can't take firebase 5.x/17.x
  # (needs Dart 3.6+), and resolving newest-allowed mixes eras with
  # mismatched Pigeon schemas ("Nonnull field projectId is null").
  # core 3.8.x + messaging 15.0.x + interface 5.x shipped together.
  firebase_core: '>=3.8.0 <3.9.0'
  firebase_messaging: '>=15.0.0 <15.1.0'
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^8.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
